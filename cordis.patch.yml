# dsh-graft bundle patch: inserts the plugin row into the profile roster.
# Installed with: dsh plugin --profile <name> add /Users/mars/jobs/dsh-graft
#
# Node-only plugin: mounts agent tools (graft_*) over ctx.sessionController.
# No config required.
- insert:
    - id: graft
      name: '@mars.liu/dsh-graft'
